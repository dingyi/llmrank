<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>llmrank — AI model benchmarks: intelligence, cost, speed</title>
  <meta name="description" content="Compare 280+ AI models on intelligence, cost per task, end-to-end time, output speed and token pricing. Data from Artificial Analysis." />
  <meta property="og:title" content="llmrank — AI model benchmarks" />
  <meta property="og:description" content="Intelligence, cost and speed across 280+ AI models. Data from Artificial Analysis." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Crect x='7' y='17' width='4' height='8' rx='1' fill='%236ea8fe'/%3E%3Crect x='14' y='12' width='4' height='13' rx='1' fill='%236ea8fe'/%3E%3Crect x='21' y='7' width='4' height='18' rx='1' fill='%236ea8fe'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem('llmrank-theme');
      if (t !== 'light' && t !== 'dark')
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="5" y="17" width="5" height="9" rx="1.5" />
          <rect x="13.5" y="11" width="5" height="15" rx="1.5" />
          <rect x="22" y="5" width="5" height="21" rx="1.5" />
        </svg>
        <div class="brand-text">
          <h1>llmrank</h1>
          <p class="tagline">AI model benchmarks — intelligence, cost &amp; speed</p>
        </div>
      </div>
      <div class="masthead-actions">
        <button id="theme-toggle" class="btn" type="button" aria-label="Toggle color theme">
          <svg class="icon-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.2v1.8M8 13v1.8M1.2 8H3M13 8h1.8M3.2 3.2l1.3 1.3M11.5 11.5l1.3 1.3M12.8 3.2l-1.3 1.3M4.5 11.5l-1.3 1.3"/></svg>
          <svg class="icon-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.8 5.8 0 0 1 6.5 2.5a5.8 5.8 0 1 0 7 7Z"/></svg>
          <span id="theme-label">Dark</span>
        </button>
      </div>
    </header>

    <p class="meta" id="meta-line">Loading data…</p>

    <section class="controls" aria-label="Filters">
      <div class="control-row">
        <div class="search-wrap">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
          <input id="search" type="search" placeholder="Search models or creators…" autocomplete="off" spellcheck="false" />
        </div>
        <button id="reset" class="btn" type="button">Reset filters</button>
      </div>

      <div class="chips" id="creator-chips" role="group" aria-label="Filter by creator"></div>

      <div class="sliders">
        <div class="slider-field">
          <div class="slider-head">
            <label for="min-intelligence">Min intelligence</label>
            <output id="min-intelligence-value">any</output>
          </div>
          <input id="min-intelligence" type="range" min="0" max="70" step="1" value="0" />
        </div>
        <div class="slider-field">
          <div class="slider-head">
            <label for="max-cost">Max cost / task</label>
            <output id="max-cost-value">any</output>
          </div>
          <input id="max-cost" type="range" min="0" max="1000" step="1" value="1000" />
        </div>
        <div class="slider-field">
          <div class="slider-head">
            <label for="max-time">Max time / task</label>
            <output id="max-time-value">any</output>
          </div>
          <input id="max-time" type="range" min="0" max="1000" step="1" value="1000" />
        </div>
      </div>

      <div class="control-row columns-row">
        <span class="control-label">Columns</span>
        <div class="chips chips-sm" id="column-chips" role="group" aria-label="Toggle columns"></div>
      </div>
    </section>

    <section class="table-card">
      <div class="table-scroll" id="table-scroll">
        <table id="table">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>
        <p>No models match these filters.</p>
        <button class="btn" type="button" id="empty-reset">Reset filters</button>
      </div>
    </section>

    <footer class="footer">
      <p>
        Data sourced from
        <a href="https://artificialanalysis.ai/" target="_blank" rel="noopener">Artificial Analysis</a>
        (Intelligence Index, cost &amp; performance benchmarks). llmrank is not affiliated with Artificial Analysis.
      </p>
      <p class="footer-sub" id="footer-updated"></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
